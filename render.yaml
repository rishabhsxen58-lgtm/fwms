services:
  - type: web
    name: faculty-workload-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false      - key: DATABASE_FILE
        value: /tmp/workload.sqlite
      - key: SEED_DEMO
        value: "true"
